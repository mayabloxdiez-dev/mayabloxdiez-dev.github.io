<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="A simple, playable Pong game. Control your paddle with the mouse or arrow keys.">
  <title>Pong — Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Cousine", "Courier New", monospace;
      background: #07111f;
      color: #e8f4ff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background: radial-gradient(ellipse at 50% 42%, #14253b 0%, #091525 48%, #050b14 100%);
    }

    main { width: min(100%, 960px); }

    .heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 2px 18px;
    }

    h1 {
      margin: 0;
      color: #f4f9ff;
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #42e8c2;
      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .status {
      color: #8da3bc;
      font-size: .75rem;
      text-align: right;
    }

    .cabinet {
      padding: clamp(10px, 2vw, 20px);
      border: 1px solid #263d57;
      border-radius: 16px;
      background: linear-gradient(145deg, #102039, #091525 65%);
      box-shadow: 0 22px 70px #0008, inset 0 1px #ffffff0b;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(24px, 9vw, 90px);
      padding: 2px 0 16px;
    }

    .score-block { min-width: 90px; text-align: center; }
    .player-name { color: #8da3bc; font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; }
    .score { margin-top: 3px; font-size: clamp(2rem, 7vw, 3rem); font-weight: 700; line-height: 1; }
    .score.you { color: #42e8c2; text-shadow: 0 0 20px #42e8c255; }
    .score.cpu { color: #ff6b8a; text-shadow: 0 0 20px #ff6b8a55; }
    .versus { color: #56708c; font-size: .7rem; letter-spacing: .15em; }

    .court-wrap {
      overflow: hidden;
      border: 1px solid #29415e;
      border-radius: 9px;
      background: #071321;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 900 / 520;
      cursor: crosshair;
      touch-action: none;
      outline: none;
    }

    canvas:focus-visible { box-shadow: inset 0 0 0 2px #42e8c2; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 16px;
    }

    .hints { color: #8196af; font-size: .72rem; line-height: 1.7; }
    .hints strong { color: #c9d8e8; font-weight: 400; }
    .buttons { display: flex; gap: 8px; }

    button {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid #36516f;
      border-radius: 7px;
      background: #13253b;
      color: #e8f4ff;
      font: inherit;
      font-size: .75rem;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
    }

    button:hover { border-color: #42e8c2; background: #19314b; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid #42e8c2; outline-offset: 3px; }
    button.primary { border-color: #42e8c2; background: #123b3b; color: #8df7dc; }

    @media (max-width: 520px) {
      .heading { align-items: start; flex-direction: column; }
      .status { text-align: left; }
      .controls { align-items: stretch; flex-direction: column; }
      .buttons button { flex: 1; }
      .score-block { min-width: 70px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="heading">
      <div>
        <p class="eyebrow">A tiny arcade classic</p>
        <h1>Pong</h1>
      </div>
      <div class="status" id="status" aria-live="polite">First to 7 wins</div>
    </header>

    <section class="cabinet" aria-label="Pong game">
      <div class="scoreboard" aria-label="Scoreboard">
        <div class="score-block">
          <div class="player-name">You</div>
          <div class="score you" id="player-score" aria-label="Your score">0</div>
        </div>
        <div class="versus">— : —</div>
        <div class="score-block">
          <div class="player-name">Computer</div>
          <div class="score cpu" id="computer-score" aria-label="Computer score">0</div>
        </div>
      </div>

      <div class="court-wrap">
        <canvas id="game" width="900" height="520" tabindex="0" aria-label="Pong court. Move your mouse or use the up and down arrow keys to control the left paddle."></canvas>
      </div>

      <div class="controls">
        <div class="hints"><strong>Move:</strong> mouse or ↑ / ↓ &nbsp; <strong>Pause:</strong> Space</div>
        <div class="buttons">
          <button class="primary" id="pause-button" type="button">Pause</button>
          <button id="restart-button" type="button">Restart</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const playerScoreEl = document.getElementById('player-score');
      const computerScoreEl = document.getElementById('computer-score');
      const statusEl = document.getElementById('status');
      const pauseButton = document.getElementById('pause-button');

      const W = canvas.width;
      const H = canvas.height;
      const paddle = { width: 13, height: 94, inset: 34, speed: 440 };
      const ballRadius = 9;
      const winningScore = 7;
      const player = { x: paddle.inset, y: H / 2 - paddle.height / 2, score: 0 };
      const computer = { x: W - paddle.inset - paddle.width, y: H / 2 - paddle.height / 2, score: 0 };
      const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, speed: 390 };
      const keys = { up: false, down: false };
      let running = true;
      let finished = false;
      let lastTime = 0;
      let serveTimer = 0;
      let serveDirection = Math.random() < 0.5 ? -1 : 1;
      let playerPointerActive = false;

      function updateScore() {
        playerScoreEl.textContent = player.score;
        computerScoreEl.textContent = computer.score;
      }

      function resetBall(direction = Math.random() < 0.5 ? -1 : 1) {
        ball.x = W / 2;
        ball.y = H / 2;
        ball.vx = 0;
        ball.vy = 0;
        serveDirection = direction;
        serveTimer = 0.75;
      }

      function startServe() {
        const angle = (Math.random() * 0.8 - 0.4);
        ball.vx = Math.cos(angle) * ball.speed * serveDirection;
        ball.vy = Math.sin(angle) * ball.speed;
      }

      function restart() {
        player.score = 0;
        computer.score = 0;
        player.y = H / 2 - paddle.height / 2;
        computer.y = H / 2 - paddle.height / 2;
        finished = false;
        running = true;
        lastTime = 0;
        pauseButton.textContent = 'Pause';
        statusEl.textContent = 'First to 7 wins';
        updateScore();
        resetBall();
        canvas.focus({ preventScroll: true });
      }

      function setPaused(paused) {
        if (finished) return;
        running = !paused;
        pauseButton.textContent = paused ? 'Resume' : 'Pause';
        statusEl.textContent = paused ? 'Paused' : 'First to 7 wins';
        lastTime = 0;
      }

      function clampPaddle(p) {
        p.y = Math.max(0, Math.min(H - paddle.height, p.y));
      }

      function movePlayerToPointer(event) {
        const rect = canvas.getBoundingClientRect();
        const scaleY = H / rect.height;
        player.y = (event.clientY - rect.top) * scaleY - paddle.height / 2;
        clampPaddle(player);
      }

      canvas.addEventListener('pointermove', (event) => {
        playerPointerActive = true;
        movePlayerToPointer(event);
      });
      canvas.addEventListener('pointerdown', (event) => {
        playerPointerActive = true;
        movePlayerToPointer(event);
        canvas.focus({ preventScroll: true });
      });

      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowUp' || event.key === 'ArrowDown' || event.code === 'Space') event.preventDefault();
        if (event.key === 'ArrowUp') keys.up = true;
        if (event.key === 'ArrowDown') keys.down = true;
        if (event.code === 'Space' && !event.repeat) setPaused(running);
      });
      window.addEventListener('keyup', (event) => {
        if (event.key === 'ArrowUp') keys.up = false;
        if (event.key === 'ArrowDown') keys.down = false;
      });
      window.addEventListener('blur', () => {
        keys.up = false;
        keys.down = false;
        if (running && !finished) setPaused(true);
      });

      pauseButton.addEventListener('click', () => setPaused(running));
      document.getElementById('restart-button').addEventListener('click', restart);

      function update(dt) {
        if (serveTimer > 0) {
          serveTimer -= dt;
          if (serveTimer <= 0) startServe();
        }

        if (keys.up || keys.down) {
          playerPointerActive = false;
          player.y += ((keys.down ? 1 : 0) - (keys.up ? 1 : 0)) * paddle.speed * dt;
          clampPaddle(player);
        }

        // The computer tracks the ball with a small reaction delay and speed limit.
        const target = ball.vx > 0 ? ball.y - paddle.height / 2 : H / 2 - paddle.height / 2;
        const difference = target - computer.y;
        const aiSpeed = 315;
        computer.y += Math.max(-aiSpeed * dt, Math.min(aiSpeed * dt, difference));
        clampPaddle(computer);

        if (serveTimer > 0 || !ball.vx) return;

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        if (ball.y - ballRadius <= 0) {
          ball.y = ballRadius;
          ball.vy = Math.abs(ball.vy);
        } else if (ball.y + ballRadius >= H) {
          ball.y = H - ballRadius;
          ball.vy = -Math.abs(ball.vy);
        }

        // Paddle collisions add a little angle based on where the ball hits.
        if (ball.vx < 0 && ball.x - ballRadius <= player.x + paddle.width &&
            ball.x + ballRadius >= player.x && ball.y + ballRadius >= player.y &&
            ball.y - ballRadius <= player.y + paddle.height) {
          ball.x = player.x + paddle.width + ballRadius;
          const hit = (ball.y - (player.y + paddle.height / 2)) / (paddle.height / 2);
          const angle = hit * 0.9;
          ball.speed = Math.min(ball.speed + 14, 650);
          ball.vx = Math.cos(angle) * ball.speed;
          ball.vy = Math.sin(angle) * ball.speed;
        }

        if (ball.vx > 0 && ball.x + ballRadius >= computer.x &&
            ball.x - ballRadius <= computer.x + paddle.width && ball.y + ballRadius >= computer.y &&
            ball.y - ballRadius <= computer.y + paddle.height) {
          ball.x = computer.x - ballRadius;
          const hit = (ball.y - (computer.y + paddle.height / 2)) / (paddle.height / 2);
          const angle = hit * 0.9;
          ball.speed = Math.min(ball.speed + 14, 650);
          ball.vx = -Math.cos(angle) * ball.speed;
          ball.vy = Math.sin(angle) * ball.speed;
        }

        if (ball.x + ballRadius < 0) scorePoint(computer);
        else if (ball.x - ballRadius > W) scorePoint(player);
      }

      function scorePoint(winner) {
        winner.score += 1;
        updateScore();
        if (winner.score >= winningScore) {
          finished = true;
          running = false;
          statusEl.textContent = winner === player ? 'You win! Nice game.' : 'Computer wins — try again!';
          pauseButton.textContent = 'Pause';
          return;
        }
        statusEl.textContent = winner === player ? 'Point for you!' : 'Point for computer';
        resetBall(winner === player ? 1 : -1);
        window.setTimeout(() => {
          if (!finished && running) statusEl.textContent = 'First to 7 wins';
        }, 1000);
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#071321';
        ctx.fillRect(0, 0, W, H);

        // Dashed center line and subtle court glow.
        ctx.save();
        ctx.setLineDash([9, 13]);
        ctx.strokeStyle = '#29415e';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(W / 2, 20);
        ctx.lineTo(W / 2, H - 20);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = '#42e8c2';
        ctx.shadowColor = '#42e8c2';
        ctx.shadowBlur = 18;
        ctx.fillRect(player.x, player.y, paddle.width, paddle.height);
        ctx.fillStyle = '#ff6b8a';
        ctx.shadowColor = '#ff6b8a';
        ctx.fillRect(computer.x, computer.y, paddle.width, paddle.height);
        ctx.fillStyle = '#f4f9ff';
        ctx.shadowColor = '#f4f9ff';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (!running || finished) {
          ctx.fillStyle = '#071321bb';
          ctx.fillRect(0, 0, W, H);
          ctx.textAlign = 'center';
          ctx.fillStyle = '#f4f9ff';
          ctx.font = 'bold 25px Cousine, monospace';
          const message = finished ? (player.score > computer.score ? 'YOU WIN!' : 'COMPUTER WINS') : 'PAUSED';
          ctx.fillText(message, W / 2, H / 2 - 4);
          ctx.fillStyle = '#a8bbcf';
          ctx.font = '14px Cousine, monospace';
          ctx.fillText(finished ? 'Press Restart to play again' : 'Press Space or Resume to continue', W / 2, H / 2 + 28);
        } else if (serveTimer > 0) {
          ctx.fillStyle = '#8298b0';
          ctx.textAlign = 'center';
          ctx.font = '13px Cousine, monospace';
          ctx.fillText('GET READY', W / 2, H / 2 + 42);
        }
      }

      function frame(time) {
        const dt = lastTime ? Math.min((time - lastTime) / 1000, 0.035) : 0;
        lastTime = time;
        if (running && !finished) update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      // Keep input state in sync when a key is released outside the browser window.
      window.addEventListener('blur', () => { keys.up = false; keys.down = false; });
      canvas.addEventListener('pointerleave', () => { playerPointerActive = false; });
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
